name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Lint spec
        uses: vaibhav-jain/spectral-action/@v2.6.1
        with:
          file_path: remote-signing-oapi.yaml

      - name: Bundle spec
        uses: mpetrunic/swagger-cli-action@v1.0.0
        with:
          command: "bundle ./remote-signing-oapi.yaml -r -t yaml -o ./bundle.yaml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify signing example vectors
        run: |
          pip install pyyaml
          python scripts/verify_signing_examples.py
